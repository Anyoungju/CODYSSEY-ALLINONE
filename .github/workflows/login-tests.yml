name: Login target safety tests
on: [push, workflow_dispatch]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s automation/tests -v
      - run: python -m compileall -q automation/scripts
      - run: bash -n E1-1/scripts/verify.sh
